<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="referrer" content="no-referrer">
    <title>羽球比賽計分板</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Titillium+Web:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=24">
    <link rel="stylesheet" href="css/tournament.css?v=24">
    <link rel="stylesheet" href="css/champion-moment.css?v=24">
    <!-- 頁面顏色（2026-11-19）：輸分連結白色、觀賽連結黑色，body 畫出來前就決定（js/page-theme.js） -->
    <script src="js/tournament-form.js?v=24"></script>
    <script src="js/page-theme.js?v=24"></script>
</head>
<body class="tournament-page">
    <header class="header tournament-header">
        <h1><i class="fas fa-trophy"></i> <span id="tournamentName"></span></h1>
        <div id="finishedBadge" class="finished-badge" hidden>比賽已結束</div>
    </header>

    <main class="tournament-main">
        <div id="offlineBox" class="offline-box" hidden></div>
        <div id="errorBox" class="error-box" hidden></div>

        <!-- 直播（2026-11-25 友誼賽起）：賽事資料有 YouTube 網址時才出現，只在觀賽頁（js/live.js） -->
        <section id="liveSection" class="live-section" hidden></section>

        <!-- 比點賽制（2026-11-25 友誼賽起）：點數計分板＋公司應援條，取代排名表 -->
        <section id="pointsSection" hidden>
            <h2><i class="fas fa-flag-checkered"></i> 點數比分</h2>
            <div id="pointBoard"></div>
            <div id="cheerSection" class="cheer-section" hidden></div>
        </section>

        <section id="standingsSection" hidden>
            <h2><i class="fas fa-ranking-star"></i> 即時排名</h2>
            <div id="standings"></div>
        </section>

        <section id="scheduleSection" hidden>
            <h2><i class="fas fa-table-list"></i> 賽程</h2>
            <div id="schedule"></div>
        </section>
    </main>

    <!-- 隊長輸分彈窗（Task 5 啟用） -->
    <div id="reportOverlay" class="report-overlay" hidden>
        <div class="report-modal">
            <h3 id="reportTitle">輸入比分</h3>
            <p id="reportSubtitle" class="report-subtitle"></p>
            <p id="reportLineup" class="report-lineup" hidden></p>
            <div class="score-inputs">
                <label>我方 <span id="myTeamName"></span>
                    <input id="scoreSelf" type="number" inputmode="numeric" min="0" max="21" step="1">
                </label>
                <span class="score-colon">：</span>
                <label>對方 <span id="oppTeamName"></span>
                    <input id="scoreOpp" type="number" inputmode="numeric" min="0" max="21" step="1">
                </label>
            </div>
            <div class="report-actions">
                <button id="reportCancel" type="button" class="btn-cancel">取消</button>
                <button id="reportSubmit" type="button" class="btn-submit">送出</button>
            </div>
        </div>
    </div>

    <script src="js/dialog.js?v=24"></script>
    <script src="js/standings.js?v=24"></script>
    <script src="js/team-points.js?v=24"></script>
    <script src="js/tournament-api.js?v=24"></script>
    <script src="js/cheer.js?v=24"></script>
    <script src="js/live.js?v=24"></script>
    <script src="js/champion-moment.js?v=24"></script>
    <script src="js/tournament.js?v=24"></script>
</body>
</html>
